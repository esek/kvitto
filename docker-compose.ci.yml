# Needs docker v2 since COMPOSE_PROJECT_NAME is not available in v1
version: '3.9'
networks:
  traefik:
    external: true

services:
  kvitto:
    image: '${IMAGE_NAME}'
    environment:
      NODE_ENV: production
      DEPLOY_URL: ${DEPLOY_URL}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_URL: ${AUTH_URL}
      EMAIL_URL: ${EMAIL_URL}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT}
      PUBLIC_BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT}
      FORTNOX_CLIENT_ID: ${FORTNOX_CLIENT_ID}
      FORTNOX_CLIENT_SECRET: ${FORTNOX_CLIENT_SECRET}
      KVITTOHAKE_AUTH_SECRET: ${KVITTOHAKE_AUTH_SECRET}
   
    volumes:
      - ./uploads:/app/uploads
    
    networks:
      - traefik
      - default
    restart: unless-stopped
    labels:
      - 'traefik.http.routers.$COMPOSE_PROJECT_NAME.rule=Host(`$DEPLOY_URL`)'