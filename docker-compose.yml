version: '3.6'

volumes:
  kvitto_postgres:

services:
  postgres:
    image: postgres:alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kvitto
    volumes:
      - kvitto_postgres:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    restart: unless-stopped
